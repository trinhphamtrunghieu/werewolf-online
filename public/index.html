<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12241d" />
  <meta name="description" content="Bàn Chơi: Ma Sói, Ai là gián điệp và các trò chơi nhóm, mỗi người một điện thoại." />
  <title>Bàn Chơi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23ede2c8'/%3E%3Ccircle cx='68' cy='42' r='40' fill='%2312241d'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-time="night">
  <div class="toast-zone" id="toasts" role="status" aria-live="polite"></div>
  <div class="art-ticker" id="artTicker" role="status" aria-live="polite" hidden></div>
  <main class="app" id="app">
    <noscript>Hãy bật JavaScript để chơi Ma Sói.</noscript>
  </main>

  <dialog class="sheet card-sheet" id="cardSheet" aria-labelledby="cardSheetTitle">
    <div class="sheet-body" id="cardSheetBody"></div>
  </dialog>

  <dialog class="sheet sheet-wide" id="rulesSheet" aria-labelledby="rulesTitle">
    <div class="sheet-body" id="rulesBody"></div>
  </dialog>

  <dialog class="sheet" id="deckSheet" aria-labelledby="deckTitle">
    <div class="sheet-body" id="deckBody"></div>
  </dialog>

  <dialog class="sheet art-notice" id="artNotice" aria-labelledby="artNoticeTitle">
    <div class="sheet-body" id="artNoticeBody"></div>
  </dialog>

  <dialog class="sheet" id="notesSheet" aria-labelledby="notesTitle">
    <div class="sheet-body" id="notesBody"></div>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
