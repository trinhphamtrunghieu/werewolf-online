<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161b36" />
  <meta name="description" content="Chơi Ma Sói cùng bạn bè: mỗi người một điện thoại, máy chủ phòng làm quản trò đọc lời dẫn." />
  <title>Ma Sói Online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23efe4c8'/%3E%3Ccircle cx='68' cy='42' r='40' fill='%23161b36'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,700;0,800;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-time="night">
  <div class="toast-zone" id="toasts" role="status" aria-live="polite"></div>
  <main class="app" id="app">
    <noscript>Hãy bật JavaScript để chơi Ma Sói.</noscript>
  </main>

  <dialog class="sheet" id="cardSheet" aria-labelledby="cardSheetTitle">
    <div class="sheet-body" id="cardSheetBody"></div>
  </dialog>

  <dialog class="sheet" id="rulesSheet" aria-labelledby="rulesTitle">
    <div class="sheet-body" id="rulesBody"></div>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
